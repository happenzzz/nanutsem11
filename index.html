<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>나눔 자료 · 마이쮸 옮기기</title>
  <style>
    :root {
      --ink: #142136;
      --navy: #253e68;
      --teal: #11bdc8;
      --teal-dark: #078391;
      --yellow: #ffe583;
      --orange: #ff8b4c;
      --card: rgba(255,255,255,.94);
      --line: rgba(37,62,104,.16);
      --shadow: 0 16px 36px rgba(37,62,104,.14);
      --source-candy-w: clamp(94px, 7.25vw, 136px);
      --source-candy-h: clamp(38px, 2.9vw, 54px);
      --plate-candy-w: clamp(86px, 6.05vw, 118px);
      --plate-candy-h: clamp(34px, 2.45vw, 48px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 2% -3%, rgba(255,229,131,.98) 0 190px, transparent 191px),
        radial-gradient(circle at 96% 3%, rgba(17,189,200,.24) 0 230px, transparent 231px),
        linear-gradient(135deg, #f3fbff 0%, #fbfffb 48%, #fff8e8 100%);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button { font: inherit; border: 0; cursor: pointer; user-select: none; }
    button:focus-visible { outline: 0; box-shadow: 0 0 0 6px rgba(17,189,200,.24); }

    .activity {
      width: min(1920px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: clamp(10px, 1.2vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(10px, .9vw, 16px);
      position: relative;
    }

    .source-panel,
    .friend-card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: clamp(20px, 1.5vw, 30px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .source-panel {
      min-height: clamp(118px, 14.6vh, 162px);
      padding: clamp(10px, .9vw, 16px) clamp(12px, 1.1vw, 20px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, .6vw, 12px);
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      overflow: visible;
    }

    .source-panel.drop-ready,
    .friend-card.drop-ready {
      border-color: rgba(17,189,200,.75);
      box-shadow: 0 0 0 7px rgba(17,189,200,.14), var(--shadow);
      transform: translateY(-1px);
    }

    .source-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .title-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .title {
      color: var(--navy);
      font-size: clamp(26px, 2.1vw, 40px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(92px, 7vw, 132px);
      min-height: clamp(40px, 3vw, 56px);
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: clamp(19px, 1.45vw, 28px);
      line-height: 1;
      font-weight: 1000;
      white-space: nowrap;
      box-shadow: 0 7px 0 rgba(37,62,104,.15);
    }

    .source-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }

    .mini-btn {
      min-height: clamp(42px, 3vw, 56px);
      padding: 8px clamp(12px, 1.1vw, 18px);
      border-radius: 999px;
      background: #eef7ff;
      color: var(--navy);
      font-size: clamp(16px, 1.1vw, 22px);
      font-weight: 1000;
      white-space: nowrap;
      box-shadow: inset 0 -4px 0 rgba(37,62,104,.07);
      transition: transform .12s ease, filter .12s ease;
    }

    .mini-btn:active { transform: translateY(2px); }

    .fullscreen-toggle {
      min-height: clamp(38px, 2.8vw, 50px);
      padding: 7px clamp(12px, 1vw, 17px);
      border-radius: 999px;
      background: #e9fcff;
      color: var(--teal-dark);
      border: 2px solid rgba(17,189,200,.28);
      font-size: clamp(15px, 1vw, 20px);
      line-height: 1;
      font-weight: 1000;
      white-space: nowrap;
      box-shadow: inset 0 -4px 0 rgba(17,189,200,.12), 0 6px 12px rgba(37,62,104,.06);
      transition: transform .12s ease, filter .12s ease;
    }

    .fullscreen-toggle:active { transform: translateY(2px); }

    .activity:fullscreen,
    .activity:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      background:
        radial-gradient(circle at 2% -3%, rgba(255,229,131,.98) 0 190px, transparent 191px),
        radial-gradient(circle at 96% 3%, rgba(17,189,200,.24) 0 230px, transparent 231px),
        linear-gradient(135deg, #f3fbff 0%, #fbfffb 48%, #fff8e8 100%);
    }

    .next-step-wrap {
      position: relative;
      z-index: 7000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .next-step-circle {
      width: clamp(46px, 3.25vw, 64px);
      height: clamp(46px, 3.25vw, 64px);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #efffd0 0 18%, #b7f26a 35%, #7bd940 100%);
      border: clamp(3px, .25vw, 5px) solid #fff;
      box-shadow: 0 7px 0 rgba(61,145,30,.24), 0 12px 20px rgba(37,62,104,.14);
      position: relative;
      touch-action: manipulation;
      transition: transform .12s ease, filter .12s ease;
    }

    .next-step-circle::after {
      content: "";
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      background: rgba(255,255,255,.50);
      transform: translate(-13%, -13%);
    }

    .next-step-circle:active { transform: translateY(2px); }

    .next-step-pop {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      align-items: center;
      gap: clamp(10px, .9vw, 16px);
      min-width: clamp(190px, 14vw, 260px);
      padding: clamp(12px, 1vw, 18px) clamp(16px, 1.35vw, 24px);
      border-radius: clamp(18px, 1.35vw, 25px);
      border: 3px solid rgba(85, 184, 46, .62);
      background: linear-gradient(135deg, #f5ffe5, #d9ffab);
      color: #204516;
      box-shadow: 0 14px 28px rgba(37,62,104,.18), inset 0 -5px 0 rgba(85,184,46,.12);
      font-size: clamp(20px, 1.35vw, 28px);
      line-height: 1.06;
      font-weight: 1000;
      letter-spacing: -0.045em;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .next-step-pop.show {
      display: inline-flex;
      animation: nextPop .16s ease both;
    }

    .next-step-pop::before {
      content: "";
      position: absolute;
      top: -10px;
      right: clamp(16px, 1.4vw, 25px);
      width: 18px;
      height: 18px;
      transform: rotate(45deg);
      background: #f5ffe5;
      border-left: 3px solid rgba(85, 184, 46, .62);
      border-top: 3px solid rgba(85, 184, 46, .62);
    }

    .next-step-arrow {
      display: inline-grid;
      place-items: center;
      width: clamp(42px, 3vw, 56px);
      height: clamp(42px, 3vw, 56px);
      border-radius: 50%;
      background: #fff;
      color: #52b12e;
      font-size: clamp(32px, 2.4vw, 46px);
      line-height: 1;
      box-shadow: inset 0 -4px 0 rgba(85,184,46,.12);
    }

    @keyframes nextPop {
      from { transform: translateY(-5px) scale(.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .friend-card[data-character="kkadori"] .character-btn,
    .friend-card[data-character="kkasuni"] .character-btn {
      width: clamp(106px, 8.35vw, 154px);
      height: clamp(106px, 8.35vw, 154px);
    }

    .friend-card[data-character="kkadori"] .character-img,
    .friend-card[data-character="kkasuni"] .character-img {
      width: 104%;
      height: 104%;
    }

    .source-items {
      min-height: var(--source-candy-h);
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      align-content: center;
      gap: clamp(5px, .55vw, 10px);
      min-width: 0;
      overflow: visible;
    }

    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, .9vw, 16px);
      overflow: visible;
      position: relative;
    }

    .friend-card {
      min-height: 0;
      padding: clamp(12px, .9vw, 18px);
      display: grid;
      grid-template-rows: clamp(132px, 16vh, 188px) minmax(0, 1fr);
      gap: clamp(8px, .8vw, 14px);
      position: relative;
      overflow: visible;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .friend-card.active-character {
      border-color: rgba(255,139,76,.78);
      box-shadow: 0 0 0 7px rgba(255,139,76,.14), var(--shadow);
    }

    .friend-head {
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(118px, 9.4vw, 170px) minmax(0, 1fr);
      gap: clamp(10px, .9vw, 16px);
      align-items: center;
      overflow: visible;
      position: relative;
      z-index: 12;
    }

    .character-btn {
      width: clamp(116px, 9vw, 164px);
      height: clamp(116px, 9vw, 164px);
      padding: 0;
      border-radius: 50%;
      background: transparent;
      border: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      box-shadow: none;
      touch-action: manipulation;
      transition: transform .13s ease, box-shadow .13s ease, border-color .13s ease;
      position: relative;
    }

    .character-btn:active { transform: translateY(2px) scale(.98); }
    .friend-card.active-character .character-btn { filter: drop-shadow(0 0 12px rgba(255,139,76,.36)); }

    .character-img {
      width: 110%;
      height: 110%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 5px 2px rgba(37,62,104,.14));
    }

    .friend-copy {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: clamp(7px, .55vw, 10px);
      overflow: visible;
    }

    .inline-bubble {
      display: none;
      width: min(100%, 440px);
      min-height: clamp(70px, 8.6vh, 104px);
      align-items: center;
      justify-content: center;
      position: relative;
      padding: clamp(10px, .75vw, 15px) clamp(15px, 1.05vw, 22px);
      border: clamp(3px, .22vw, 4px) solid #0c2a3a;
      border-radius: 32px 38px 36px 34px / 34px 38px 36px 40px;
      background: #fff;
      color: #050505;
      font-size: clamp(24px, 1.95vw, 38px);
      line-height: 1.12;
      font-weight: 1000;
      letter-spacing: -0.065em;
      text-align: center;
      word-break: keep-all;
      white-space: pre-line;
      box-shadow: 0 9px 20px rgba(37,62,104,.12);
      z-index: 13;
    }

    .inline-bubble.show {
      display: flex;
      animation: inlineBubblePop .16s ease both;
    }

    .inline-bubble::before {
      content: "";
      position: absolute;
      left: clamp(-23px, -1.4vw, -16px);
      bottom: clamp(12px, 1.2vw, 22px);
      width: clamp(28px, 2.4vw, 46px);
      height: clamp(20px, 1.8vw, 34px);
      background: #fff;
      border-left: clamp(3px, .22vw, 4px) solid #0c2a3a;
      border-bottom: clamp(3px, .22vw, 4px) solid #0c2a3a;
      transform: rotate(24deg) skew(-18deg);
      z-index: -1;
    }

    @keyframes inlineBubblePop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .friend-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .friend-name {
      min-width: 0;
      color: var(--navy);
      font-size: clamp(24px, 1.9vw, 36px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -0.055em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plate-count {
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(37,62,104,.10);
      color: #33445f;
      font-size: clamp(16px, 1.1vw, 22px);
      line-height: 1;
      font-weight: 1000;
      white-space: nowrap;
    }

    .plate-area {
      min-height: 0;
      position: relative;
      border-radius: clamp(18px, 1.4vw, 28px);
      background: linear-gradient(180deg, rgba(255,255,255,.46), rgba(247,251,255,.72));
      overflow: hidden;
      isolation: isolate;
    }

    .plate-shape {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 6%;
      bottom: 6%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #fff 0 44%, #eefcff 45% 62%, #bceafa 63% 100%);
      border: clamp(4px, .35vw, 6px) solid #a7daed;
      box-shadow: inset 0 -12px 14px rgba(37,62,104,.08), 0 12px 16px rgba(37,62,104,.06);
      pointer-events: none;
      z-index: 1;
    }

    .plate-shape::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 2px dashed rgba(104,183,210,.32);
    }

    .drop-pad {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 15%;
      bottom: 14%;
      z-index: 3;
      display: grid;
      place-items: center;
      border: 2px dashed rgba(37,62,104,.10);
      border-radius: 44% / 50%;
      background: rgba(255,255,255,.18);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .friend-card.drop-ready .drop-pad {
      border-color: rgba(17,189,200,.67);
      background: rgba(233,252,255,.30);
      box-shadow: inset 0 0 0 5px rgba(17,189,200,.05);
    }

    .plate-items {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      gap: clamp(5px, .55vw, 10px);
      padding: clamp(10px, 1vw, 18px);
      position: relative;
      z-index: 4;
    }

    .candy {
      width: var(--source-candy-w);
      flex: 0 1 var(--source-candy-w);
      height: var(--source-candy-h);
      padding: 0;
      border-radius: 14px;
      background: transparent;
      box-shadow: none;
      touch-action: none;
      cursor: grab;
      position: relative;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }

    .plate-items .candy {
      width: var(--plate-candy-w);
      height: var(--plate-candy-h);
    }

    .candy img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 5px 2px rgba(37,62,104,.16));
    }

    .candy.selected {
      transform: translateY(-4px) scale(1.06);
      filter: drop-shadow(0 0 0 rgba(0,0,0,0));
    }

    .candy.selected::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 17px;
      border: 5px solid rgba(17,189,200,.78);
      box-shadow: 0 0 0 6px rgba(17,189,200,.16);
      pointer-events: none;
    }

    .candy.is-being-dragged { opacity: .25; }

    .drag-ghost,
    .fly-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      margin: 0;
      transform-origin: center center;
    }

    .drag-ghost { transform: scale(1.12) rotate(-5deg); filter: drop-shadow(0 16px 18px rgba(0,0,0,.18)); }
    .fly-ghost { filter: drop-shadow(0 16px 18px rgba(0,0,0,.18)); }

    .big-bubble {
      position: fixed;
      z-index: 5000;
      pointer-events: none;
      display: none;
      place-items: center;
      width: min(720px, 44vw);
      min-height: clamp(172px, 19vh, 242px);
      padding: clamp(26px, 2.3vw, 46px) clamp(34px, 3vw, 62px);
      border: clamp(4px, .35vw, 6px) solid #0c2a3a;
      border-radius: 52% / 56%;
      background: #fff;
      color: #050505;
      font-size: clamp(42px, 3.75vw, 76px);
      line-height: 1.18;
      font-weight: 1000;
      letter-spacing: -0.075em;
      text-align: center;
      word-break: keep-all;
      white-space: pre-line;
      box-shadow: 0 18px 36px rgba(37,62,104,.18);
    }

    .big-bubble.show {
      display: grid;
      animation: bubblePop .18s ease both;
    }

    @keyframes bubblePop {
      from { transform: scale(.92); opacity: 0; }
      to { opacity: 1; }
    }

    .big-bubble.from-one {
      left: clamp(74px, 7.8vw, 154px);
      top: clamp(132px, 19vh, 218px);
    }

    .big-bubble.from-two {
      left: 50%;
      top: clamp(132px, 19vh, 218px);
      transform: translateX(-50%);
    }

    .big-bubble.from-two.show { animation-name: bubblePopCenter; }

    @keyframes bubblePopCenter {
      from { transform: translateX(-50%) scale(.92); opacity: 0; }
      to { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    .big-bubble.from-free {
      right: clamp(54px, 5.6vw, 120px);
      top: clamp(132px, 19vh, 218px);
    }

    .big-bubble::before {
      content: "";
      position: absolute;
      width: clamp(58px, 5vw, 96px);
      height: clamp(44px, 4vw, 78px);
      background: #fff;
      border-color: #0c2a3a;
      border-style: solid;
      z-index: -1;
    }

    .big-bubble.from-one::before {
      left: clamp(24px, 2.5vw, 48px);
      bottom: clamp(20px, 2.4vw, 44px);
      border-width: 0 0 clamp(4px, .35vw, 6px) clamp(4px, .35vw, 6px);
      transform: rotate(24deg) skew(-20deg);
    }

    .big-bubble.from-two::before {
      left: 50%;
      bottom: clamp(14px, 2vw, 34px);
      border-width: 0 0 clamp(4px, .35vw, 6px) clamp(4px, .35vw, 6px);
      transform: translateX(-50%) rotate(12deg) skew(-18deg);
    }

    .big-bubble.from-free::before {
      right: clamp(24px, 2.5vw, 48px);
      bottom: clamp(20px, 2.4vw, 44px);
      border-width: 0 clamp(4px, .35vw, 6px) clamp(4px, .35vw, 6px) 0;
      transform: rotate(-24deg) skew(20deg);
    }

    /* 말풍선은 캐릭터 옆 공간에 표시하고, 화면을 가리는 고정형 말풍선은 사용하지 않습니다. */
    #bigBubble { display: none !important; }

    @media (max-width: 1280px) and (orientation: landscape) {
      :root {
        --source-candy-w: clamp(82px, 7vw, 102px);
        --source-candy-h: clamp(32px, 2.7vw, 40px);
        --plate-candy-w: clamp(72px, 5.9vw, 88px);
        --plate-candy-h: clamp(29px, 2.35vw, 36px);
      }
      .activity { padding: 10px; gap: 10px; }
      .source-panel { min-height: 112px; }
      .friend-card { grid-template-rows: 124px minmax(0, 1fr); }
      .friend-head { grid-template-columns: 112px minmax(0,1fr); }
      .character-btn { width: 106px; height: 106px; }
      .friend-card[data-character="kkadori"] .character-btn,
      .friend-card[data-character="kkasuni"] .character-btn { width: 98px; height: 98px; }
      .friend-name { font-size: 24px; }
      .plate-count { font-size: 16px; }
      .big-bubble { display: none !important; }
      .inline-bubble { min-height: 72px; padding: 10px 14px; font-size: clamp(23px, 1.9vw, 30px); border-radius: 28px; }
    }

    @media (max-width: 900px), (orientation: portrait) {
      body { overflow: auto; touch-action: manipulation; }
      .activity { height: auto; min-height: 100svh; }
      .source-items { flex-wrap: wrap; overflow: visible; }
      .board { grid-template-columns: 1fr; overflow: visible; }
      .friend-card { min-height: 460px; }
      .big-bubble { display: none !important; }
      .inline-bubble { width: min(100%, 520px); min-height: 78px; font-size: clamp(25px, 6vw, 40px); }
      .source-head { align-items: flex-start; flex-wrap: wrap; }
      .title-wrap, .source-actions { flex-wrap: wrap; }
      .next-step-pop { right: auto; left: 50%; transform: translateX(-50%); }
      .next-step-pop.show { animation-name: nextPopMobile; }
    }

    @keyframes nextPopMobile {
      from { transform: translateX(-50%) translateY(-5px) scale(.96); opacity: 0; }
      to { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }


    /* 새 단계 안내는 상단 헤더 안에서만 펼쳐져 마이쮸와 접시를 가리지 않게 합니다. */
    .next-step-wrap { gap: 8px; }
    .next-step-pop {
      position: static;
      order: -1;
      transform: none;
      margin-right: 2px;
    }
    .next-step-pop::before { display: none; }
    .next-step-pop.show { animation: nextPopInline .16s ease both; }
    @keyframes nextPopInline {
      from { transform: translateX(8px) scale(.96); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }

    .character-img {
      width: 104%;
      height: 104%;
    }

      const CANDY_IMAGES = [ASSETS.purple, ASSETS.pink, ASSETS.orange, ASSETS.green, ASSETS.red, ASSETS.orange, ASSETS.purple, ASSETS.green, ASSETS.pink, ASSETS.red, ASSETS.orange, ASSETS.green];

      const characterInfo = {
        one: { name: "까돌이", message: "한 번에 1개씩\n나누어 줄거야" },
        two: { name: "까순이", message: "한 번에 2개씩\n나누어 줄거야" },
        free: { name: "후티", message: "난 마음대로\n나눌거야" }
      };

      const STORAGE_KEY = "mychewDivisionActivity:v4";
      const WINDOW_NAME_PREFIX = "mychewDivisionActivity:v4:";
      const NEXT_STEP_URL = "https://nanutsem.happenz.workers.dev/";
      let saveTimer = null;

      const state = {
        pieces: [],
        selectedPiece: null,
        readyStrategy: "",
        bubbleStrategy: "",
        bubbleMessage: "",
        autoRunning: false,
        dragCleanup: null
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));
      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      document.addEventListener("DOMContentLoaded", init);

      function init() {
        hydrateImages();
        const restored = restoreSavedState();
        if (!restored) resetPieces(false);
        attachEvents();
        renderPieces();
        restoreBubbleFromState();
        if (state.selectedPiece !== null) highlightDropTargets(true);
        updateFullscreenButton();
      }

      function hydrateImages() {
        $$('img[data-asset]').forEach((img) => {
          img.src = ASSETS[img.dataset.asset];
        });
      }

      function attachEvents() {
        $("#resetBtn").addEventListener("click", () => resetAll());
        $("#fullscreenBtn")?.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleFullscreen();
        });
        $("#nextStepCircle")?.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleNextStepPop();
        });
        $("#nextStepPop")?.addEventListener("click", (event) => {
          event.stopPropagation();
          saveStateNow();
          window.location.href = NEXT_STEP_URL;
        });
        document.addEventListener("click", (event) => {
          if (!event.target.closest("#nextStepWrap")) hideNextStepPop();
        });
        document.addEventListener("fullscreenchange", updateFullscreenButton);
        document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

        $("#clearSelectionBtn").addEventListener("click", () => {
          state.selectedPiece = null;
          highlightDropTargets(false);
          renderPieces();
          saveStateDebounced();
        });

        $("#sourcePanel").addEventListener("click", (event) => {
          if (event.target.closest(".candy") || event.target.closest("button") || event.target.closest("#nextStepWrap")) return;
          if (state.selectedPiece !== null && !state.autoRunning) movePiece(state.selectedPiece, "source");
        });

        $$(".friend-card").forEach((card) => {
          const target = Number(card.dataset.dropTarget);
          card.addEventListener("click", (event) => {
            if (event.target.closest(".candy") || event.target.closest(".character-btn")) return;
            if (state.selectedPiece !== null && !state.autoRunning) movePiece(state.selectedPiece, target);
          });
        });

        $$(".character-btn").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            handleCharacterClick(button.dataset.strategy);
          });
        });

        window.addEventListener("resize", () => {
          if (state.selectedPiece !== null) highlightDropTargets(true);
        });
      }

      function resetPieces(clearBubble = true) {
        state.pieces = Array.from({ length: 12 }, (_, index) => ({
          id: index,
          place: "source",
          img: CANDY_IMAGES[index % CANDY_IMAGES.length]
        }));
        state.selectedPiece = null;
        state.autoRunning = false;
        state.readyStrategy = "";
        if (clearBubble) hideBubble();
      }

      function resetAll() {
        clearSavedState();
        resetPieces(true);
        highlightDropTargets(false);
        setActiveCharacter("");
        hideNextStepPop();
        renderPieces();
        saveStateNow();
      }

      function renderPieces() {
        const sourceItems = $("#sourceItems");
        sourceItems.innerHTML = "";
        $$('[data-plate-items]').forEach((zone) => { zone.innerHTML = ""; });

        state.pieces.forEach((piece) => {
          const element = createCandyElement(piece);
          if (piece.place === "source") {
            sourceItems.appendChild(element);
          } else {
            const plate = $(`[data-plate-items="${piece.place}"]`);
            if (plate) plate.appendChild(element);
          }
        });

        updateCounts();
        saveStateDebounced();
      }

      function createCandyElement(piece) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `candy${state.selectedPiece === piece.id ? " selected" : ""}`;
        button.dataset.id = String(piece.id);
        button.setAttribute("aria-label", `마이쮸 ${piece.id + 1}`);
        button.innerHTML = `<img alt="" src="${piece.img}" />`;
        attachCandyPointer(button);
        return button;
      }

      function attachCandyPointer(element) {
        element.addEventListener("pointerdown", (event) => {
          if (state.autoRunning) return;
          if (typeof event.button === "number" && event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();

          if (state.dragCleanup) state.dragCleanup();

          const id = Number(element.dataset.id);
          const startX = event.clientX;
          const startY = event.clientY;
          let dragging = false;
          let ghost = null;

          const onMove = (moveEvent) => {
            const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
            if (!dragging && distance > 7) {
              dragging = true;
              ghost = element.cloneNode(true);
              ghost.classList.add("drag-ghost");
              ghost.classList.remove("selected");
              ghost.style.width = `${element.offsetWidth}px`;
              ghost.style.height = `${element.offsetHeight}px`;
              ghost.style.left = `${moveEvent.clientX - element.offsetWidth / 2}px`;
              ghost.style.top = `${moveEvent.clientY - element.offsetHeight / 2}px`;
              document.body.appendChild(ghost);
              element.classList.add("is-being-dragged");
              highlightDropTargets(true);
            }
            if (dragging && ghost) {
              ghost.style.left = `${moveEvent.clientX - ghost.offsetWidth / 2}px`;
              ghost.style.top = `${moveEvent.clientY - ghost.offsetHeight / 2}px`;
            }
          };

          const cleanup = () => {
            if (ghost) ghost.remove();
            element.classList.remove("is-being-dragged");
            highlightDropTargets(false);
            state.dragCleanup = null;
          };

          const onUp = (upEvent) => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onCancel);

            if (dragging) {
              const targetEl = document.elementFromPoint(upEvent.clientX, upEvent.clientY)?.closest("[data-drop-target]");
              if (targetEl) {
                const target = targetEl.dataset.dropTarget === "source" ? "source" : Number(targetEl.dataset.dropTarget);
                movePiece(id, target);
              }
              cleanup();
              return;
            }

            toggleSelectedPiece(id);
            state.dragCleanup = null;
          };

          const onCancel = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onCancel);
            cleanup();
          };

          state.dragCleanup = cleanup;
          window.addEventListener("pointermove", onMove, { passive: false });
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onCancel);
        });
      }

      function toggleSelectedPiece(id) {
        if (state.autoRunning) return;
        state.selectedPiece = state.selectedPiece === id ? null : id;
        renderPieces();
        highlightDropTargets(state.selectedPiece !== null);
        saveStateDebounced();
      }

      function movePiece(id, target) {
        if (state.autoRunning) return;
        const piece = state.pieces.find((item) => item.id === id);
        if (!piece) return;
        piece.place = target;
        state.selectedPiece = null;
        renderPieces();
        highlightDropTargets(false);
        saveStateNow();
      }

      function updateCounts() {
        const sourceLeft = state.pieces.filter((piece) => piece.place === "source").length;
        $("#sourceCount").textContent = `${sourceLeft}개`;
        for (let index = 0; index < 3; index += 1) {
          const count = state.pieces.filter((piece) => piece.place === index).length;
          const badge = $(`[data-count-for="${index}"]`);
          if (badge) badge.textContent = `${count}개`;
        }
      }

      function highlightDropTargets(on) {
        $$('[data-drop-target]').forEach((target) => target.classList.toggle("drop-ready", on));
      }

      function handleCharacterClick(strategy) {
        if (state.autoRunning) return;
        const info = characterInfo[strategy];
        if (!info) return;

        showBubble(strategy, info.message);
        setActiveCharacter(strategy);

        if (state.readyStrategy === strategy) {
          saveStateNow();
          runAuto(strategy);
          return;
        }

        state.readyStrategy = strategy;
        saveStateNow();
      }

      function showBubble(strategy, message, shouldSave = true) {
        hideBubble(false);
        const bubble = $(`[data-bubble-for="${strategy}"]`);
        if (!bubble) return;
        bubble.textContent = message;
        bubble.classList.add("show");
        state.bubbleStrategy = strategy;
        state.bubbleMessage = message;
        if (shouldSave) saveStateDebounced();
      }

      function hideBubble(shouldSave = true) {
        $$(".inline-bubble").forEach((bubble) => {
          bubble.textContent = "";
          bubble.classList.remove("show");
        });
        const legacyBubble = $("#bigBubble");
        if (legacyBubble) {
          legacyBubble.textContent = "";
          legacyBubble.className = "big-bubble";
        }
        state.bubbleStrategy = "";
        state.bubbleMessage = "";
        if (shouldSave) saveStateDebounced();
      }

      function setActiveCharacter(strategy) {
        $$(".friend-card").forEach((card) => card.classList.remove("active-character"));
        if (!strategy) return;
        const button = $(`.character-btn[data-strategy="${strategy}"]`);
        button?.closest(".friend-card")?.classList.add("active-character");
      }

      async function runAuto(strategy) {
        state.autoRunning = true;
        state.selectedPiece = null;
        highlightDropTargets(false);
        state.pieces.forEach((piece) => { piece.place = "source"; });
        renderPieces();
        await wait(560);

        const batches = getAutoBatches(strategy);
        for (const batch of batches) {
          const ids = getSourceIds(batch.length);
          if (ids.length < batch.length) break;
          await animateBatch(ids, batch);
          ids.forEach((id, index) => {
            const piece = state.pieces.find((item) => item.id === id);
            if (piece) piece.place = batch[index];
          });
          renderPieces();
          await wait(strategy === "two" ? 260 : 180);
        }

        state.autoRunning = false;
        state.readyStrategy = "";
        renderPieces();
        saveStateNow();
      }


      function restoreBubbleFromState() {
        if (state.bubbleStrategy && characterInfo[state.bubbleStrategy]) {
          const message = state.bubbleMessage || characterInfo[state.bubbleStrategy].message;
          showBubble(state.bubbleStrategy, message, false);
          setActiveCharacter(state.bubbleStrategy);
        } else {
          hideBubble(false);
          setActiveCharacter("");
        }
      }

      function normalizePlace(place) {
        if (place === "source") return "source";
        const number = Number(place);
        return [0, 1, 2].includes(number) ? number : "source";
      }

      function restoreSavedState() {
        try {
          const raw = readSavedRaw();
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (!saved || saved.version !== 4 || !Array.isArray(saved.pieces)) return false;

          const savedById = new Map(saved.pieces.map((piece) => [Number(piece.id), normalizePlace(piece.place)]));
          state.pieces = Array.from({ length: 12 }, (_, index) => ({
            id: index,
            place: savedById.has(index) ? savedById.get(index) : "source",
            img: CANDY_IMAGES[index % CANDY_IMAGES.length]
          }));

          const selected = Number(saved.selectedPiece);
          state.selectedPiece = Number.isInteger(selected) && selected >= 0 && selected < 12 ? selected : null;
          state.readyStrategy = characterInfo[saved.readyStrategy] ? saved.readyStrategy : "";
          state.bubbleStrategy = characterInfo[saved.bubbleStrategy] ? saved.bubbleStrategy : "";
          state.bubbleMessage = state.bubbleStrategy ? String(saved.bubbleMessage || characterInfo[state.bubbleStrategy].message) : "";
          state.autoRunning = false;
          state.dragCleanup = null;
          return true;
        } catch (error) {
          console.warn("저장된 활동을 불러오지 못했습니다.", error);
          clearSavedState();
          return false;
        }
      }

      function saveStateDebounced() {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveStateNow, 70);
      }

      function saveStateNow() {
        try {
          const snapshot = {
            version: 4,
            savedAt: Date.now(),
            pieces: state.pieces.map((piece) => ({ id: piece.id, place: piece.place })),
            selectedPiece: state.selectedPiece,
            readyStrategy: state.readyStrategy,
            bubbleStrategy: state.bubbleStrategy,
            bubbleMessage: state.bubbleMessage
          };
          writeSavedRaw(JSON.stringify(snapshot));
        } catch (error) {
          console.warn("활동 상태를 저장하지 못했습니다.", error);
        }
      }

      function readSavedRaw() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return raw;
        } catch (error) { /* fallback below */ }
        try {
          return typeof window.name === "string" && window.name.startsWith(WINDOW_NAME_PREFIX)
            ? window.name.slice(WINDOW_NAME_PREFIX.length)
            : "";
        } catch (error) {
          return "";
        }
      }

      function writeSavedRaw(raw) {
        let stored = false;
        try {
          localStorage.setItem(STORAGE_KEY, raw);
          stored = true;
        } catch (error) { /* fallback below */ }
        try { window.name = `${WINDOW_NAME_PREFIX}${raw}`; } catch (error) { /* ignore */ }
        return stored;
      }

      function clearSavedState() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (error) { /* ignore */ }
        try {
          if (typeof window.name === "string" && window.name.startsWith(WINDOW_NAME_PREFIX)) window.name = "";
        } catch (error) { /* ignore */ }
      }

      async function toggleFullscreen() {
        const fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;
        try {
          if (fullscreenElement) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
          } else {
            const target = $(".activity") || document.documentElement;
            if (target.requestFullscreen) await target.requestFullscreen();
            else if (target.webkitRequestFullscreen) await target.webkitRequestFullscreen();
          }
        } catch (error) {
          console.warn("전체화면 전환을 할 수 없습니다.", error);
        } finally {
          updateFullscreenButton();
        }
      }

      function updateFullscreenButton() {
        const button = $("#fullscreenBtn");
        if (!button) return;
        const isFull = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        button.textContent = isFull ? "전체화면 해제" : "전체화면";
        button.setAttribute("aria-pressed", String(isFull));
      }

      function toggleNextStepPop() {
        const pop = $("#nextStepPop");
        if (!pop) return;
        pop.classList.toggle("show");
      }

      function hideNextStepPop() {
        $("#nextStepPop")?.classList.remove("show");
      }

      function getAutoBatches(strategy) {
        if (strategy === "one") {
          return [0,1,2,0,1,2,0,1,2,0,1,2].map((target) => [target]);
        }
        if (strategy === "two") {
          return [[0,0], [1,1], [2,2], [0,0], [1,1], [2,2]];
        }
        return [[1,1,1], [0], [2,2], [1,1], [0,0,0], [1]];
      }

      function getSourceIds(count) {
        return state.pieces
          .filter((piece) => piece.place === "source")
          .slice(0, count)
          .map((piece) => piece.id);
      }

      async function animateBatch(ids, targets) {
        const animations = ids.map((id, index) => flyCandy(id, targets[index], index, ids.length));
        await Promise.all(animations);
      }

      async function flyCandy(id, target, index = 0, total = 1) {
        const element = $(`.candy[data-id="${id}"]`);
        const targetCard = $(`.friend-card[data-drop-target="${target}"]`);
        const targetPad = targetCard?.querySelector(".drop-pad");
        if (!element || !targetPad) return wait(260);

        const from = element.getBoundingClientRect();
        const to = targetPad.getBoundingClientRect();
        const clone = element.cloneNode(true);
        clone.classList.remove("selected");
        clone.classList.add("fly-ghost");
        clone.style.left = `${from.left}px`;
        clone.style.top = `${from.top}px`;
        clone.style.width = `${from.width}px`;
        clone.style.height = `${from.height}px`;
        document.body.appendChild(clone);
        element.style.opacity = ".18";

        const spread = total === 1 ? 0 : (index - (total - 1) / 2) * Math.min(42, to.width * .12);
        const targetX = to.left + to.width / 2 - from.left - from.width / 2 + spread;
        const targetY = to.top + to.height / 2 - from.top - from.height / 2 + (index % 2 ? 18 : -12);
        const rotate = index % 2 ? 5 : -5;
        const duration = 430 + index * 45;

        try {
          const animation = clone.animate([
            { transform: "translate(0, 0) scale(1) rotate(0deg)", offset: 0 },
            { transform: `translate(${targetX * .55}px, ${targetY * .35 - 40}px) scale(1.12) rotate(${rotate}deg)`, offset: .55 },
            { transform: `translate(${targetX}px, ${targetY}px) scale(.98) rotate(${rotate * -0.4}deg)`, offset: 1 }
          ], { duration, easing: "cubic-bezier(.18,.72,.2,1)", fill: "forwards" });
          await animation.finished;
        } catch (error) {
          await wait(duration);
        } finally {
          element.style.opacity = "";
          clone.remove();
        }
      }
    })();
  </script>
</body>
